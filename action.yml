name: SherlockScan
description: Scan one Python source tree, notebook, wheel, source archive, or PyPI package.
inputs:
  target:
    description: Exact scan target. Paths with spaces are supported.
    default: "."
  fail-on:
    description: Fail for unsuppressed findings at this severity or higher.
    default: HIGH
  format:
    description: md, json, sarif, or html.
    default: sarif
  output:
    description: File where the report will be written.
    default: sherlockscan.sarif
  python-version:
    description: Python version used to run the scanner.
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install scanner
      shell: bash
      working-directory: ${{ github.action_path }}
      run: python -m pip install .
    - name: Scan target
      shell: bash
      env:
        SHERLOCKSCAN_TARGET: ${{ inputs.target }}
        SHERLOCKSCAN_THRESHOLD: ${{ inputs.fail-on }}
        SHERLOCKSCAN_FORMAT: ${{ inputs.format }}
        SHERLOCKSCAN_OUTPUT: ${{ inputs.output }}
      run: |
        python -I -m sherlockscan.cli scan --fail-on "$SHERLOCKSCAN_THRESHOLD" \
          --format "$SHERLOCKSCAN_FORMAT" --output "$SHERLOCKSCAN_OUTPUT" -- "$SHERLOCKSCAN_TARGET"
