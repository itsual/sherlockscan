[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlockscan"
version = "0.3.0"
description = "Explainable static risk inspection for Python package artifacts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Arockia Liborious"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["typer>=0.12,<1.0", "PyYAML>=6,<7", "packaging>=23", "toml>=0.10.2"]

[project.scripts]
sherlockscan = "sherlockscan.cli:app"

[project.urls]
Homepage = "https://github.com/itsual/sherlockscan"
Issues = "https://github.com/itsual/sherlockscan/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build", "twine", "jsonschema>=4"]

[tool.setuptools.packages.find]
include = ["sherlockscan*"]

[tool.setuptools.package-data]
sherlockscan = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "integration"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
