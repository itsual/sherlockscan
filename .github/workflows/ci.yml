name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check sherlockscan tests integration scripts
      - run: python -m pip install --upgrade pip setuptools wheel build
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distributions.py
      - name: Test distribution artifact upload
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - name: Test distribution artifact download
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/download-artifact@v8.0.2
        with:
          name: ci-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-roundtrip/
      - name: Verify downloaded distributions match original bytes
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          python -c "from pathlib import Path; a=Path('dist'); b=Path('artifact-roundtrip');
          assert sorted(p.name for p in a.iterdir()) == sorted(p.name for p in b.iterdir());
          assert all(p.read_bytes() == (b/p.name).read_bytes() for p in a.iterdir())"
