name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 runner images do not offer Python 3.9.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check sherlockscan tests integration scripts
      - run: python -m pip install --upgrade pip setuptools wheel build
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distributions.py
      - name: Test distribution artifact upload
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - name: Test distribution artifact download
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/download-artifact@v8.0.2
        with:
          name: ci-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-roundtrip/
      - name: Verify downloaded distributions match original bytes
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: >-
          python -c "from pathlib import Path; a=Path('dist'); b=Path('artifact-roundtrip');
          assert sorted(p.name for p in a.iterdir()) == sorted(p.name for p in b.iterdir());
          assert all(p.read_bytes() == (b/p.name).read_bytes() for p in a.iterdir())"
      - name: Prepare a wheel for the composite action smoke test
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          target = Path(os.environ["RUNNER_TEMP"]) / "scanner action fixture"
          target.mkdir()
          with ZipFile(target / "demo-1.0-py3-none-any.whl", "w") as wheel:
              wheel.writestr("demo-1.0.dist-info/METADATA",
                             "Metadata-Version: 2.1\nName: demo\nVersion: 1.0\n")
              wheel.writestr("demo/__init__.py", "answer = 42\n")
          PY
      - name: Scan a wheel through the composite action
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: ./
        with:
          target: ${{ runner.temp }}/scanner action fixture/demo-1.0-py3-none-any.whl
          format: json
          output: ${{ runner.temp }}/scanner-smoke.json
      - name: Verify composite action report
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: >-
          python -c "from pathlib import Path; import json, os;
          report=json.loads((Path(os.environ['RUNNER_TEMP']) / 'scanner-smoke.json').read_text());
          assert report['package_name'] == 'demo';
          assert not report['findings'];
          assert report['coverage']['complete'], report['coverage']['limitations']"
